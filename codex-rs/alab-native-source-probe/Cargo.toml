[package]
name = "codex-alab-native-source-probe"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
named-exec-probe = ["dep:codex-exec"]
native-source-proof = ["codex-alab-aterm/native-source-proof"]

[[test]]
name = "native-source-proof"
path = "tests/source.rs"
harness = false
test = false
bench = false
required-features = ["native-source-proof"]

[[test]]
name = "named-exec-probe"
path = "tests/exec_quota.rs"
harness = false
test = false
bench = false
required-features = ["named-exec-probe"]

[dependencies]
codex-exec = { workspace = true, optional = true }

[dev-dependencies]
codex-alab-aterm = { path = "../alab-aterm" }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
codex-app-server = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-cli = { workspace = true }
codex-websocket-auth = { workspace = true }
codex-alab-core = { path = "../alab-core" }
codex-alab-tui = { path = "../alab-tui" }
codex-core = { workspace = true }
codex-login = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }

# Explicit debug fixture assembly, no application/shipping build.
codex-config = { workspace = true }
codex-exec-server = { workspace = true }
codex-feedback = { workspace = true }
clap = { workspace = true, features = ["derive"] }
libc = { workspace = true }
toml = { workspace = true }
