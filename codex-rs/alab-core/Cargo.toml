name = "codex-alab-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_alab_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
toml = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
