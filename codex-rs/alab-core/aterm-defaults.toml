#
# ALab's packaged defaults that hold only inside aterm (`TERM_PROGRAM=aterm`), merged over
# `defaults.toml` in the same lowest layer: any user, profile, project or `-c` value wins.

# Native defaults, so a direct launch of the binary and an older aterm resume/fork wrapper get
# them too, but only where `TERM_PROGRAM=aterm`: under tmux inside aterm, over ssh or in
# another terminal upstream's prompts and sandbox stand. Under `never` upstream still refuses
# a forced `rm` and declines MCP elicitations that ask for data, rather than asking.
approval_policy = "never"
sandbox_mode = "danger-full-access"

[tui]
# aterm takes OSC 9 notifications. Outside aterm upstream's "auto" stands: it picks the
# method the terminal supports (BEL for one it does not know).
notification_method = "osc9"
# aterm's typed input (aterm ctl send, drive) arrives as a burst: it must submit. Outside
# aterm upstream's paste-burst detection stands, so an unbracketed multi-line paste is held
# as one paste rather than submitted at its first newline.
disable_paste_burst = true
# codex-alab's turn as aterm's progress bar (ConEmu OSC 9;4, `alab-tui/src/progress.rs`):
# indeterminate while a turn works, this turn's plan as a percent, red when it fails, gone at
# rest. aterm's rainbow kitty turns to look when a value bar changes: a failed turn, or a plan
# filling, which needs `[tools.update_plan] enabled = true` (upstream's opt-in, left so here).
# ALab's own key (upstream's `[tui]` ignores it); a person's `alab_progress = false` turns the
# bar off (vendor codex's `--strict-config` refuses the key; codex-alab's takes it).
alab_progress = true
