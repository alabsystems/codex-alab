# codex-alab-tui: ALab's policy for the interactive TUI. Upstream files reach it through
# one-line ALAB(<topic>): hooks; nothing here depends on codex-tui, so the TUI can depend on it.
[package]
name = "codex-alab-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_alab_tui"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
codex-alab-aterm = { path = "../alab-aterm" }
codex-alab-core = { path = "../alab-core" }
codex-terminal-detection = { workspace = true }
libc = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
codex-alab-aterm = { path = "../alab-aterm", features = ["test-support"] }
codex-config = { workspace = true }
codex-core = { workspace = true }
codex-features = { workspace = true }
codex-state = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
