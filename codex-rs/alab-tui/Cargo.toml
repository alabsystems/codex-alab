# codex-alab-tui: ALab's policy for the interactive TUI. Upstream files reach it through
# one-line ALAB(<topic>): hooks; nothing here depends on codex-tui, so the TUI can depend on it.
[package]
name = "codex-alab-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_alab_tui"
path = "src/lib.rs"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-alab-aterm = { path = "../alab-aterm" }
codex-alab-core = { path = "../alab-core" }
codex-alab-input = { path = "../alab-input" }
codex-terminal-detection = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
libc = { workspace = true }
ratatui = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
codex-alab-aterm = { path = "../alab-aterm", features = ["test-support"] }
codex-config = { workspace = true }
codex-core = { workspace = true }
codex-features = { workspace = true }
codex-http-client = { workspace = true }
codex-models-manager = { workspace = true }
codex-protocol = { workspace = true }
codex-skills = { workspace = true }
codex-state = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-path-uri = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
