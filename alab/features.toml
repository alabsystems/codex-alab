topics = ["exec-accounting", "exec-config", "exec-ephemeral", "exec-input", "exec-mail", "exec-recovery", "exec-review", "exec-transfer", "exec-tree", "resume-projection", "turns", "goal-clock", "upgrade-input"]
implementation = ["codex-rs/alab-core/glue", "codex-rs/alab-input", "codex-rs/alab-core/src/goal_clock.rs", "codex-rs/alab-autopilot/glue/goal_accounting_clock.rs", "codex-rs/alab-tui/src/input.rs", "codex-rs/alab-tui/src/upgrade_startup.rs"]
invariants = ["Native End acknowledgement and persistence closure precede successful handoff.", "Accepted input, queues, review delegates and model context retain exact state.", "The destination supplies fresh runtime authority and item-ID ownership.", "Cancellation cannot orphan a registered child or silently consume input.", "Restored clocks are data and require separate native transport admission.", "One joined reader retains queued input and parser state through prepare, commit, and rollback."]
scenarios = ["Suspend with queued input, active review and nested children.", "Restore sampling counters, audio metadata, ID allocation ordinals and review budgeting; reject malformed snapshots.", "Cancel before and after destination child registration.", "Restore saved helper intent under current account/model authority without turning an implicit selection into an explicit override.", "Checkpoint native goal accounting and input, including partial paste, quarantine, and startup replay."]
equivalence = "Upstream supports the complete native tree handoff contract including partial failure and cancellation."

[[features]]
id = "provider-recovery"
lifecycle = "active"
purpose = "Recover eligible foreground work while preserving provider pacing and account custody."
topics = ["capacity", "quota", "recovery", "retry-status", "wake", "weekly-reset", "goal-recovery", "daybreak"]
implementation = ["codex-rs/alab-quota-recovery", "codex-rs/alab-core/glue/responses_retry.rs", "alab/smoke/weekly_reset.py", "codex-rs/alab-tui/glue/app_safety_recovery.rs", "codex-rs/alab-tui/glue/chat_hand.rs"]
invariants = ["Reset-credit redemption requires verified reset eligibility.", "Provider deadlines survive delayed reporting and host sleep.", "Terminal or unadvised errors do not become generic retry loops.", "Cancellation ends recovery waits and stale status cannot reach another connection.", "Automatic safety recovery revalidates current-thread authority at execution and keeps an explicit retry cap."]
scenarios = ["Advised and unadvised overload, invalid compaction and retry exhaustion.", "Natural reset, earned reset, duplicate receipt, account switch and long-wait cancellation.", "Duplicate or cross-thread safety notices, revoked authority, capped retries, and fallback without repeating acknowledged effects."]
