# Behavior ownership inventory. Topics locate adapters; they do not prove parity.
# Validation evidence remains attached to each exact integration, never this file.
schema = 1
status = "initial-contract-inventory"

[[features]]
id = "account-isolation"
lifecycle = "active"
purpose = "Keep credential use and account assignment bound to the actual runtime owner."
topics = ["accounts", "auth-path", "auth-refresh-lock", "auth-renewal", "bootstrap-auth", "gateway-cookie", "manager-catalog", "renewal"]
implementation = ["codex-rs/alab-core/src/account_handoff.rs", "codex-rs/alab-core/src/auth_lock.rs", "codex-rs/alab-core/src/managed_auth.rs", "codex-rs/alab-core/glue/auth_epoch_snapshot.rs", "codex-rs/alab-core/glue/auth_owner.rs", "codex-rs/alab-core/glue/credential_output.rs", "codex-rs/alab-core/glue/auth_native_member_tests.rs", "codex-rs/alab-core/glue/gateway_cookie.rs", "codex-rs/alab-cloud-contracts"]
invariants = ["No retired account background read or transport enters the destination account.", "Refresh writes hold the credential file lock and retain source ownership.", "Assertion-only authentication never becomes an invented bearer credential.", "Raw-token clients bind the captured credential source to their caller transport before token extraction; a getter cannot recapture newer account authority.", "Credential output retains original-source admission through the write and revalidates before exposing bearer bytes.", "Restored preference data cannot revive an old credential owner or turn an inherited automatic choice into another account's explicit override."]
scenarios = ["Switch accounts during async budget checks and WebSocket reuse.", "Race refresh and assignment; refuse unavailable source ownership.", "Retain a paired HTTP client across actual direct-reader replacement and Ready; refuse its next request without sending it.", "Retain Cloud clients across source retirement, reject incompatible credential/factory pairing, and preserve destination restrictions.", "Refuse credential output after source replacement, loss or policy withdrawal; hold account retirement until the admitted output is dropped."]
equivalence = "Upstream proves destination publication, credential use, cancellation and background-read isolation under the same races."

[[features]]
