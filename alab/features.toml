id = "qualification-fixtures"
lifecycle = "active"
purpose = "Make qualification observe real lifecycle completion with bounded resources."
topics = ["core-test-fixtures", "native-event-temp", "native-snapshots", "pet-tests", "startup-test-fixture", "test", "test-assertions", "test-clock", "test-config", "test-diagnostics", "test-paths"]
implementation = ["alab/check.sh", "codex-rs/alab-core/glue", "codex-rs/alab-tui/glue", "codex-rs/alab-tui/src/fixture_clock.rs", "codex-rs/alab-tui/src/snapshot_fixtures.rs", "codex-rs/alab-tui/src/test_paths.rs", "codex-rs/alab-tui/src/test_tasks.rs", "codex-rs/alab-tui/src/test_diagnostics.rs", "codex-rs/alab-api-tests"]
invariants = ["Fixtures observe actual completion rather than aborting unfinished work.", "Exact test children drain both real pipe EOFs with bounded retained output; successful exit and the last complete anchored summary must prove exactly one passing test. Failure cleanup preserves partial evidence and bounded kill/reap.", "Configured child completion markers are observed on real stdout independently of retained output; their observation supplements successful exit, exact summary and both EOFs, and survives failure cleanup.", "Native filesystem tests use excluded scratch and bounded lifecycle phases.", "A shared pristine failure is recorded as a failure, not a pass.", "Repeated snapshots preserve exact assertions, and fixed rendering clocks remain local to their test thread.", "Timeout observations never consume pending work or expose request content."]
scenarios = ["Backend drain failure, persistent child cleanup, native watcher delivery and decoding actual compressed request payloads.", "Real small and multi-megabyte stdout/stderr children retain both ends and final results without pipe backpressure; a held child is killed, reaped and drained with partial markers retained.", "Observe a completion marker discarded from both retained ends; reject missing or wrong markers, stderr-only evidence, invented retention-gap adjacency and a marked unsuccessful process exit.", "Repeated shared inline assertions, aged overview timestamps, and long host temporary paths.", "Timeout state with buffered events, completed tasks, and busy or poisoned recorders.", "Bound public HTTP and WebSocket opening and SSE fixture phases; an incomplete real request reaches its named body deadline and cancellation, including during finish, closes the observed TCP connection."]
equivalence = "Upstream fixtures provide the same resource and completion guarantees."

[[features]]
id = "goal-storage-recovery"
lifecycle = "active"
purpose = "Keep goal admission behind acknowledged persistence and report live holds through passive runtime status."
topics = ["storage", "storage-status", "extension"]
implementation = [
    "codex-rs/alab-core/src/goal_persistence.rs",
    "codex-rs/alab-core/glue/sqlite_transaction_recovery.rs",
    "codex-rs/alab-autopilot/glue/goal_read_recovery.rs",
    "codex-rs/alab-autopilot/glue/goal_accounting_persistence.rs",
    "codex-rs/alab-autopilot/glue/goal_persistence_api.rs",
    "codex-rs/alab-autopilot/glue/goal_persistence_runtime.rs",
    "codex-rs/alab-autopilot/glue/goal_persistence_tool.rs",
    "codex-rs/alab-core/glue/goal_runtime_wire.rs",
    "codex-rs/alab-autopilot/glue/goal_runtime_status.rs",
    "codex-rs/alab-autopilot/glue/goal_status_transport.rs",
    "codex-rs/alab-autopilot/glue/goal_status_outgoing.rs",
    "codex-rs/alab-tui/glue/goal_runtime_status.rs",
    "codex-rs/alab-tui/glue/backend_bookkeeping.rs",
    "codex-rs/alab-autopilot/glue/unloaded_goal_rollout.rs",
]
invariants = [
    "Unacknowledged goal usage or status intent blocks automatic continuation and checkpoint without blocking Core's normal person-input path.",
    "Dispatched usage writes retain original goal/turn, descendant and clock baselines through observer cancellation; only definite noncommit evidence permits additive retry.",
    "Explicit mutations drain retained usage under the native permit and fence older stops by mutation generation; healthy reads or unrelated writes cannot clear a failed intent.",
    "Only acknowledged mutation releases an ordinary failed-intent hold; unsupported raw-replacement and destructive-boundary quarantine remain held.",
    "Pool release drains queued rollback before deciding whether to discard stranded transaction depth; healthy connections remain reusable.",
    "Passive runtime notifications are bounded current-owner metadata: they neither change saved goals or admission nor clear persistence holds.",
    "Authenticated backend, host, generation and sequence fences reject stale observations; settled holds alone do not manufacture live work, and real native activity remains visible.",
    "Bounded committed goal outputs preserve per-thread FIFO, with each RPC response enqueued before its matching notification through listener delivery or direct fallback, despite observer cancellation.",
]
scenarios = [
    "SQLite FULL with stranded SQLx rollback, followed by healthy borrowing; ordinary dropped transaction reuse.",
    "Cancelled dispatched accounting, failed zero-usage stop, typed noncommit versus lost acknowledgement and queued writer recheck.",
    "Retained older-turn, descendant and time usage across manual input, terminal edits, Plan and raw goal replacement.",
    "Same-ID reactivation racing a delayed stop; acknowledged explicit recovery releases an eligible hold without replaying stop policy.",
    "Ready/Writing/Held status during stalled goal reads and listener reattach, retaining the saved Active badge and real input/writer activity.",
    "Delayed or duplicate old-generation observations, cancelled output enqueue, bounded overflow reset/rearm, backend/thread switches and transport loss.",
    "Queue overlapping loaded and unloaded goal set/clear operations, cancel an observer after commit, retire the listener before or after enqueue, and exhaust then release per-thread and global reservations; preserve response-before-notification enqueue order and independent-thread progress.",
]
equivalence = "Retire when upstream preserves the same failed-write accounting, safe pool recovery and mutation fencing, plus bounded passive status with identical backend ordering and no admission authority."
