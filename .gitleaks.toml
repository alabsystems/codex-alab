#
# Gitleaks configuration for the published codex-alab tree: the standard rule set and
# nothing else. NO ALLOWLIST, deliberately: the publication engine refuses every
# repository-controlled suppression ([allowlist], per-rule allowlists, disabledRules, an
# external [extend] path or url) and an exported .gitleaksignore. The one exception it
# honours is gitleaks' own inline `gitleaks:allow` tag on the line itself, for a test
# fixture's fake credential: it clears that line for Gitleaks and for the central baseline's
# credential patterns, and for nothing else. If Gitleaks flags something real, fix it where
# it lives.

[extend]
useDefault = true
